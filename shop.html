<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | SR Immitation</title>
<meta name="description" content="SR Immitation: earrings, necklaces, bangles and sets. Pick your pieces and order on WhatsApp.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2a0f26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="index.html">SR Immitation</a>
  <div class="nav"><a class="nl" href="index.html">Home</a><a class="nl" href="shop.html">Shop</a><a class="ig" id="igTop" target="_blank" rel="noopener">Instagram</a>
  <button class="cartbtn" id="openCart" aria-label="Open cart">Cart<b id="count">0</b></button></div>
</div></header>
<main class="wrap shop" id="shop">
  <h2>The collection</h2>
  <div class="tools">
    <input id="q" type="search" placeholder="Search earrings, kundan, bangles…" aria-label="Search products">
    <select id="sort" aria-label="Sort products"><option value="new">Newest first</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  <div class="grid" id="grid"><p class="msg">Loading the collection…</p></div>
</main>
<footer>
  <span class="brand">SR Immitation</span>
  <p>WhatsApp <a id="waFoot" target="_blank" rel="noopener"></a> · Instagram <a id="igFoot" target="_blank" rel="noopener"></a></p>
</footer>

<a class="wafab" id="waFab" target="_blank" rel="noopener">Chat on WhatsApp</a>
<div class="toast" id="toast" role="status"></div>

<dialog id="detail"><button class="close" aria-label="Close" onclick="this.closest('dialog').close()">×</button><div class="d-in" id="dIn"></div></dialog>
<dialog id="drawer">
  <button class="close" id="closeCart" aria-label="Close cart">×</button>
  <h2>Your cart</h2>
  <div id="lines"></div>
  <div id="checkout">
    <div class="total"><span>Total</span><span id="total">₹0</span></div>
    <input id="cName" placeholder="Your name" autocomplete="name">
    <textarea id="cAddr" rows="3" placeholder="Delivery address with pincode" autocomplete="street-address"></textarea>
    <button class="btn send" id="send">Send order on WhatsApp</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
